name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: killerwolf/backmydataup
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository_owner }}/backmydataup

jobs:
  validate:
    name: Lint and shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backmydataup/Dockerfile
          failure-threshold: warning
          # DL3041 (pin the dnf package version) is exempted here rather than
          # inline: hadolint did not honour the inline directive for this RUN.
          # The base image is pinned by digest, so the tar version is allowed to
          # track AL2023 security updates instead of breaking the build.
          ignore: DL3041

      - name: Shellcheck backup script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=style backmydataup/backmydataup.sh

      - name: Verify script syntax
        run: sh -n backmydataup/backmydataup.sh

      # The tag resolves to a multi-arch manifest index, whose body has no
      # top-level .digest. Read the canonical digest from the response header
      # instead, which is what the registry itself resolves the tag to.
      - name: Check base image digest is current
        run: |
          set -euo pipefail
          tag=$(grep -oP 'AWS_CLI_VERSION=\K[0-9.]+' backmydataup/Dockerfile)
          pinned=$(grep -oP '@sha256:\K[0-9a-f]{64}' backmydataup/Dockerfile)
          token=$(curl -sS \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:amazon/aws-cli:pull" \
            | jq -r .token)
          actual=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/amazon/aws-cli/manifests/$tag" \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
          echo "tag=$tag"
          echo "pinned=$pinned"
          echo "actual=${actual:-<none>}"
          [ -n "$actual" ] || { echo "::error::could not read upstream digest"; exit 1; }
          if [ "$pinned" != "$actual" ]; then
            echo "::notice title=Base image digest drift::amazon/aws-cli:$tag moved"
            echo "pinned $pinned, upstream is $actual. Review the upstream changes, then update the digest in backmydataup/Dockerfile."
          fi

  build:
    name: Build, scan and smoke test
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (multi-arch, no push)
        uses: docker/build-push-action@v7
        with:
          context: backmydataup
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test on amd64
        uses: docker/build-push-action@v7
        with:
          context: backmydataup
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha

      # runner.temp is not writable by the runner user, so stage fixtures in the
      # workspace. They are created here so the mounts below are not populated
      # by Docker as root.
      - name: Stage smoke test fixtures
        run: |
          set -euo pipefail
          rm -rf ci-smoke
          mkdir -p ci-smoke/data/nested ci-smoke/out ci-smoke/stub
          echo payload > ci-smoke/data/file.txt
          echo nested > ci-smoke/data/nested/deep.txt
          cat > ci-smoke/stub/aws <<'STUB'
          #!/bin/sh
          echo "stub aws: $*"
          STUB
          chmod +x ci-smoke/stub/aws

      - name: "Guard - script must not run when S3_BUCKET is unset"
        run: |
          set +e
          output=$(docker run --rm \
            -v "$PWD/ci-smoke/data:/data:ro" \
            "${{ env.IMAGE_NAME }}:smoke" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::container exited 0 without S3_BUCKET"
            exit 1
          fi
          echo "$output" | grep -q "S3_BUCKET is not set"
          echo "guard OK"

      - name: Smoke test happy path against a stub aws
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/ci-smoke/data:/data:ro" \
            -v "$PWD/ci-smoke/out:/backup" \
            -v "$PWD/ci-smoke/stub:/stub:ro" \
            -e BACKUP_TIMESTAMP=ci-smoke \
            -e DATA_DIR=/data -e BACKUP_DIR=/backup \
            -e S3_BUCKET=ci-bucket -e S3_ENDPOINT=https://s3.example.net \
            -e PATH="/stub:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "${{ env.IMAGE_NAME }}:smoke"

          archive=ci-smoke/out/data_ci-smoke.tar.gz
          test -f "$archive"
          echo "--- archive contents ---"
          listing=$(tar tzf "$archive")
          echo "$listing"
          echo "$listing" | grep -qx "data/file.txt"
          echo "$listing" | grep -qx "data/nested/deep.txt"
          mkdir -p ci-smoke/extract
          tar xzf "$archive" -C ci-smoke/extract
          grep -qx payload ci-smoke/extract/data/file.txt
          echo "archive contents and extraction verified"

      - name: Clean up smoke test fixtures
        if: always()
        run: rm -rf ci-smoke

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:smoke
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backmydataup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
